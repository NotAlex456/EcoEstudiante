# Blueprint de Render: el servidor de EcoEstudiante (carpeta server/) en el plan gratuito.
# Render → New → Blueprint → este repositorio. Los valores con sync: false se cargan a mano en el panel.
services:
  - type: web
    name: ecoestudiante-api
    runtime: node
    plan: free
    # Misma región que la base de datos de Neon (AWS US East 2, Ohio).
    region: ohio
    rootDir: server
    # --include=dev: NODE_ENV=production omitiría tsup, que hace falta para compilar.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Aplica las migraciones, crea los datos de ejemplo si faltan (es idempotente) y arranca.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOTS_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        # La web pública (el sitio estático de abajo), el APK (https://localhost y capacitor://localhost) y el desarrollo local.
        value: https://ecoestudiante.onrender.com,https://localhost,capacitor://localhost,http://localhost:5173,http://localhost:8443
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      # Correo por API HTTP: Render gratuito bloquea los puertos SMTP (25, 465 y 587).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Correos no institucionales permitidos y administradores (panel /admin), separados por coma.
      - key: ALLOWED_EMAILS
        sync: false
      - key: ADMIN_EMAILS
        sync: false

  # La app en la web (la misma del APK, compilada con Vite) como sitio estático gratuito:
  # https://ecoestudiante.onrender.com. Se conecta al servidor de arriba (VITE_API_URL en .env.production).
  - type: web
    name: ecoestudiante
    runtime: static
    buildCommand: npx pnpm@10.34.3 install --frozen-lockfile && npx pnpm@10.34.3 build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # index.html y el service worker sin caché, para que cada versión nueva llegue al instante.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      # Los archivos compilados llevan un hash en el nombre: se pueden guardar para siempre.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
